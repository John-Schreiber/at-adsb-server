apiVersion: apps/v1
kind: Deployment
metadata:
  name: at-adsb
  labels:
    app: at-adsb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: at-adsb
  template:
    metadata:
      labels:
        app: at-adsb
    spec:
      containers:
        - name: daemon
          image: at-adsb:latest       # local build: imagePullPolicy: Never
          args:
            - "run"
            - "--socket-path"
            - "/run/at-adsb/daemon.sock"
            - "--atrx-temp-dir"
            - "/tmp/at-adsb-atrx"
          ports:
            - name: ws
              containerPort: 4100
              protocol: TCP
          env:
            - name: ATP_SERVICE
              value: "https://bsky.social"
            - name: ATP_HANDLE
              valueFrom:
                secretKeyRef:
                  name: at-adsb-credentials  # kubectl create secret generic at-adsb-credentials --from-literal=handle=... --from-literal=password=...
                  key: handle
            - name: ATP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: at-adsb-credentials
                  key: password
            # Optional: stream signing key
            # - name: STREAM_SIGNING_KEY_HEX
            #   valueFrom:
            #     secretKeyRef:
            #       name: at-adsb-credentials
            #       key: stream-signing-key
            - name: WS_PORT
              value: "4100"
            - name: STREAM_ENDPOINT
              value: "ws://at-adsb-stream:4100/xrpc/at.adsb.broadcast.subscribeEvents"
            - name: BATCH_WINDOW_S
              value: "15"
            - name: STATS_INTERVAL_M
              value: "60"
            - name: QUEUE_DB_PATH
              value: "/data/at-adsb-queue.db"
          volumeMounts:
            - name: socket
              mountPath: /run/at-adsb
            - name: atrx-tmp
              mountPath: /tmp/at-adsb-atrx
            - name: data
              mountPath: /data
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"

        - name: adapter-readsb
          image: at-adsb:latest
          args:
            - "adapter"
            - "readsb"
            - "--socket"
            - "/run/at-adsb/daemon.sock"
            - "--url"
            - "http://readsb:8080"            # adjust to your readsb service URL
            - "--source-id"
            - "readsb-1090"
            - "--poll-interval"
            - "5"
            - "--batch-window"
            - "60"
            - "--atrx-temp-dir"
            - "/tmp/at-adsb-atrx"
            # Optional: enable raw BEAST frame capture
            # - "--beast-host"
            # - "readsb"                       # hostname of BEAST TCP source
            # - "--beast-port"
            # - "30005"
          volumeMounts:
            - name: socket
              mountPath: /run/at-adsb
            - name: atrx-tmp
              mountPath: /tmp/at-adsb-atrx
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "250m"

        # Additional adapters can be added as sidecar containers here.
        # Each adapter needs:
        #   - a unique --source-id
        #   - the socket and atrx-tmp volume mounts
        #   - its own --url pointing to its decoder's HTTP API

      volumes:
        - name: socket
          emptyDir:
            medium: Memory
        - name: atrx-tmp
          emptyDir: {}
        - name: data
          emptyDir: {}                        # replace with a PVC for persistence across restarts
---
apiVersion: v1
kind: Service
metadata:
  name: at-adsb-stream
  labels:
    app: at-adsb
spec:
  type: NodePort
  selector:
    app: at-adsb
  ports:
    - name: ws
      port: 4100
      targetPort: ws
      protocol: TCP
      nodePort: 30100
